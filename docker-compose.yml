services:
  caddy:
    networks:
      - synscript-network 
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synscript-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment: 
      - NODE_ENV=production
      - PORT=5000
      - FRONTEND_URL=https://synscript-jet.vercel.app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - synscript-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://13.218.115.196.nip.io:5000
        VITE_SOCKET_URL: http://13.218.115.196.nip.io:5000
    container_name: synscript-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://13.218.115.196.nip.io:5000
      - VITE_SOCKET_URL=http://13.218.115.196.nip.io:5000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - synscript-network

networks:
  synscript-network:
    driver: bridge
volumes:
  caddy_data:
  caddy_config:
